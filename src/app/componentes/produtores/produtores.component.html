<div class="flex flex-row justify-between">
    <span class="text-4xl pt-4 font-light">Produtores</span>
    <div class="flex flex-row gap-6 items-start">
        <mat-form-field appearance="fill">
            <mat-label>Nome do produtor</mat-label>
            <input matInput placeholder="Digite o nome do produtor" [formControl]="pesquisar">
            <mat-icon matIconSuffix>search</mat-icon>
        </mat-form-field>
        <button class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 mt-4 rounded cursor-pointer"
            (click)="adicionarProdutor()">
            Adicionar
        </button>
    </div>
</div>
<div class="flex flex-col pt-4 gap-4">
    <div *ngFor="let produtor of produtores"
        class="flex flex-row bg-white hover:bg-gray-50 rounded-2xl w-full cursor-pointer p-4 gap-6"
        (click)="navega('produtor', produtor.id)">
        <div class="flex flex-col w-16 h-16 bg-green-500 rounded-full text-white text-3xl items-center justify-center">
            {{ metodosEstaticos.pegaIniciais(produtor.nome) }}
        </div>
        <div class="flex flex-col justify-center gap-1">
            <div class="text-3xl font-normal">
                {{produtor.nome}}
            </div>
            <div class="text-1xl text-gray-800">
                {{produtor.cpf_cnpj_mascara}}
            </div>
        </div>
    </div>
</div>
