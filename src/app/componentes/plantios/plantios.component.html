<div class="flex flex-row justify-between pt-4">
    <span class="text-4xl font-light">Plantios</span>
    <button class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded cursor-pointer"
        (click)="modalPlantio()">
        Adicionar
    </button>
</div>

<div class="flex flex-col pt-6 gap-6">
    <div *ngFor="let plantio of plantios" class="flex flex-row bg-white rounded-2xl w-full py-4 px-6 gap-6">
        <div class="flex flex-col justify-center gap-1 w-10/12">
            <div class="text-3xl font-normal">
                {{plantio.cultura_descricao}}
            </div>
            <div class="text-1xl text-gray-800">
                {{plantio.safra_descricao}}
            </div>
        </div>
        <div class="flex flex-row justify-end items-center w-2/12 gap-4">
            <div>
                <mat-icon class="cursor-pointer" (click)="modalPlantio(plantio)"
                    matTooltip="Editar plantio">edit</mat-icon>
            </div>
            <div>
                <mat-icon class="cursor-pointer" (click)="deletarPlantio(plantio)"
                    matTooltip="Deletar plantio">delete</mat-icon>
            </div>
        </div>
    </div>
</div>
