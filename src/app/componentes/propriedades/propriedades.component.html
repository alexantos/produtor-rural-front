<div class="flex flex-row justify-end pt-4">
    <button class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded cursor-pointer"
        (click)="modalPropriedade()">
        Adicionar
    </button>
</div>
<span class="text-2xl font-light">Propriedades</span>

<div class="flex flex-col pt-2 gap-6">
    <div *ngFor="let propriedade of propriedades"
        class="flex flex-row bg-white rounded-2xl w-full py-4 px-6 gap-6">
        <div class="flex flex-col justify-center gap-1 w-5/12">
            <div class="text-3xl font-normal">
                {{propriedade.nome }}
            </div>
            <div class="text-1xl text-gray-800">
                {{propriedade.area_total_fazenda }} ha de área total
            </div>
        </div>
        <div class="flex flex-col justify-center gap-1 w-5/12">
            <div class="text-3xl font-normal">
                {{propriedade.cidade }} - {{propriedade.estado}}
            </div>
            <div class="text-1xl text-gray-800">
                {{propriedade.area_agricultavel}} ha agricultável / {{propriedade.area_vegetacao }} ha vegetação
            </div>
        </div>
        <div class="flex flex-row justify-end items-center w-2/12 gap-4">
            <div>
                <mat-icon class="cursor-pointer" (click)="navega('propriedade', propriedade.id)" matTooltip="Plantios">eco</mat-icon>
            </div>
            <div>
                <mat-icon class="cursor-pointer" (click)="modalPropriedade(propriedade)" matTooltip="Editar propriedade">edit</mat-icon>
            </div>
            <div>
                <mat-icon class="cursor-pointer" (click)="deletarPropriedade(propriedade)" matTooltip="Deletar propriedade">delete</mat-icon>
            </div>
        </div>
    </div>
</div>
