<div class="flex flex-row md:w-6/12 w-full gap-4">
    <div class="flex flex-row rounded-lg bg-white border-l-4 border-[#bf5100] w-full">
        <div class="flex flex-col w-9/12 items-center">
            <div class="text-3xl text-gray-800">
                9
            </div>
            <div class="text-gray-800 font-light">
                Propriedades
            </div>
        </div>
        <div class="flex flex-col w-3/12 justify-center items-start">
            <mat-icon class="text-gray-800">home</mat-icon>
        </div>
    </div>
    <div class="flex flex-row rounded-lg bg-white border-l-4 border-[#006fbf] w-full">
        <div class="flex flex-col w-9/12 items-center">
            <div class="text-3xl text-gray-800">
                1448
            </div>
            <div class="text-gray-800 font-light">
                Hectares
            </div>
        </div>
        <div class="flex flex-col w-3/12 justify-center items-start">
            <mat-icon class="text-gray-800">map</mat-icon>
        </div>
    </div>
</div>
<div class="flex md:flex-row flex-col  pt-10 gap-6">
    <div class="w-full bg-white rounded-2xl">
        <div class="flex flex-row justify-center px-6 py-2">Plantio por Estado</div>
        <canvas baseChart class="chart" [data]="estadosChartData" [type]="'pie'" [options]="estadosChartOptions">
        </canvas>
    </div>
    <div class="w-full bg-white rounded-2xl">
        <div class="flex flex-row justify-center px-6 py-2">Cultura plantada</div>
        <canvas baseChart class="chart" [data]="culturasChartData" [type]="'pie'" [options]="culturasChartOptions">
        </canvas>
    </div>
    <div class="w-full bg-white rounded-2xl">
        <div class="flex flex-row justify-center px-6 py-2">Uso do solo</div>
        <canvas baseChart class="chart" [data]="usoSoloChartData" [type]="'pie'" [options]="usoSoloChartOptions">
        </canvas>
    </div>
</div>
